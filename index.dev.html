<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>钢铁咆哮 · 坦克大战 [DEV]</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305080d'/%3E%3Cpath d='M32 6l22 10v16c0 12-8 21-22 26C18 53 10 44 10 32V16L32 6z' fill='%23162231' stroke='%2322c0ff' stroke-width='4'/%3E%3Cpath d='M19 35h25v7H19zM23 25h17v10H23zM38 29h13v4H38z' fill='%23f6b94e'/%3E%3C/svg%3E">
<style>
html,body{margin:0;padding:0;background:#05080d;height:100%;overflow:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 50% 40%,rgba(34,192,255,.10),transparent 34%),
  radial-gradient(circle at 82% 76%,rgba(246,185,78,.08),transparent 28%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  opacity:.75}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#05080d;
  box-shadow:0 0 0 1px rgba(34,192,255,.28),0 0 0 2px rgba(246,185,78,.10),0 24px 80px rgba(0,0,0,.72)}
#touchovl{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;
  font-family:"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tbtn{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(22,34,49,0.88),rgba(5,8,13,0.78));border:1px solid rgba(34,192,255,0.35);border-radius:8px;
  color:rgba(243,247,255,0.78);font-weight:800;letter-spacing:1px;line-height:1.1;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 0 18px rgba(34,192,255,.08);
  font-size:clamp(10px,2.4vmin,14px);touch-action:none}
.tbtn .ic{font-size:clamp(14px,3.4vmin,20px);margin-bottom:1px}
.tbtn.on{background:linear-gradient(180deg,rgba(246,185,78,0.38),rgba(239,83,56,0.20));border-color:rgba(246,185,78,0.85);color:#f3f7ff}
#toast{position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:20;background:rgba(5,8,13,0.88);
  color:#f6b94e;border:1px solid rgba(246,185,78,0.65);border-radius:6px;padding:6px 14px;font-size:14px;
  font-weight:700;display:none;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="touchovl"></div>
<div id="toast"></div>
<!-- 构建顺序即依赖顺序; build.js 依此内联生成单文件 index.html -->
<script src="src/audio.data.js"></script>
<script src="src/data/data.js"></script>
<script src="src/core/gfx.js"></script>
<script src="src/core/engine.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/save.js"></script>
<script src="src/game/world.js"></script>
<script src="src/game/effects.js"></script>
<script src="src/game/combat.js"></script>
<script src="src/game/entities.js"></script>
<script src="src/game/render.js"></script>
<script src="src/data/assets.data.js"></script>
<script src="src/game/assetpipeline.js"></script>
<script src="src/data/ai_assets.data.js"></script>
<script src="src/game/aiart.js"></script>
<script src="src/game/ui.js"></script>
<script src="src/game/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>钢铁咆哮 · 坦克大战 [DEV]</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305080d'/%3E%3Cpath d='M32 6l22 10v16c0 12-8 21-22 26C18 53 10 44 10 32V16L32 6z' fill='%23162231' stroke='%2322c0ff' stroke-width='4'/%3E%3Cpath d='M19 35h25v7H19zM23 25h17v10H23zM38 29h13v4H38z' fill='%23f6b94e'/%3E%3C/svg%3E">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;background:#05080d;overflow:hidden;
  touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 50% 40%,rgba(34,192,255,.10),transparent 34%),
  radial-gradient(circle at 82% 76%,rgba(246,185,78,.08),transparent 28%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  opacity:.75}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#05080d;
  touch-action:none;box-shadow:0 0 0 1px rgba(34,192,255,.28),0 0 0 2px rgba(246,185,78,.10),0 24px 80px rgba(0,0,0,.72)}
#touchovl{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;
  --touch-s:clamp(48px,11vmin,66px);--touch-l:clamp(58px,13.5vmin,84px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  font-family:"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* v1.5: 圆形玻璃高透明按钮 (不支持 backdrop-filter 时自动退化为半透明) */
.tbtn{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 34%,rgba(126,158,198,0.20),rgba(22,34,49,0.26) 66%,rgba(5,8,13,0.36));
  border:1px solid rgba(255,255,255,0.28);border-radius:50%;
  color:rgba(243,247,255,0.82);font-weight:800;letter-spacing:1px;line-height:1.1;
  -webkit-backdrop-filter:blur(9px) saturate(1.35);backdrop-filter:blur(9px) saturate(1.35);
  box-shadow:inset 0 0 0 1px rgba(34,192,255,0.15),inset 0 8px 16px rgba(255,255,255,0.06),0 4px 18px rgba(0,0,0,0.38);
  font-size:clamp(10px,2.4vmin,14px);touch-action:none;outline:none;padding:0;appearance:none;-webkit-appearance:none}
.tbtn .ic{font-size:clamp(14px,3.4vmin,20px);margin-bottom:1px}
.tbtn.on{background:radial-gradient(circle at 50% 34%,rgba(246,185,78,0.34),rgba(239,83,56,0.20) 70%,rgba(5,8,13,0.34));
  border-color:rgba(246,185,78,0.70);color:#f3f7ff;
  box-shadow:inset 0 0 14px rgba(246,185,78,0.22),0 0 16px rgba(246,185,78,0.20)}
/* v1.5: 模拟摇杆圆环 (接近全透: 只留清晰环线与方向箭头, 不遮战场) */
#joy{position:absolute;left:clamp(calc(76px + var(--safe-left)),28%,calc(118px + var(--safe-left)));
  bottom:max(12px,calc(var(--safe-bottom) + 10px));width:clamp(116px,27vmin,164px);height:clamp(116px,27vmin,164px);
  transform:translateX(-50%);pointer-events:auto;touch-action:none;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,rgba(34,192,255,0.02),rgba(5,8,13,0.04) 58%,rgba(5,8,13,0.10));
  border:2px solid rgba(255,255,255,0.32);
  -webkit-backdrop-filter:blur(3px) saturate(1.15);backdrop-filter:blur(3px) saturate(1.15);
  box-shadow:inset 0 0 0 1px rgba(34,192,255,0.20),0 3px 12px rgba(0,0,0,0.22)}
#joy .jstick{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,rgba(243,247,255,0.16),rgba(22,34,49,0.24) 72%);
  border:1.5px solid rgba(255,255,255,0.42);
  box-shadow:inset 0 2px 5px rgba(255,255,255,0.14),0 3px 9px rgba(0,0,0,0.28);
  transition:transform 0.09s ease-out}
#joy.on .jstick{background:radial-gradient(circle at 50% 38%,rgba(246,185,78,0.26),rgba(22,34,49,0.24) 72%);
  border-color:rgba(246,185,78,0.55)}
.jd{position:absolute;color:rgba(243,247,255,0.52);font-size:clamp(9px,2vmin,12px);pointer-events:none;transition:color 0.1s;text-shadow:0 0 4px rgba(2,4,7,0.8)}
.jt{top:5%;left:50%;transform:translateX(-50%)}.jb{bottom:5%;left:50%;transform:translateX(-50%)}
.jl{left:6%;top:50%;transform:translateY(-50%)}.jr{right:6%;top:50%;transform:translateY(-50%)}
#joy.jU .jt,#joy.jD .jb,#joy.jL .jl,#joy.jR .jr{color:#f6b94e;text-shadow:0 0 6px rgba(246,185,78,0.6)}
#toast{position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(10,17,28,0.52);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  color:#f6b94e;border:1px solid rgba(246,185,78,0.55);border-radius:999px;padding:6px 16px;font-size:14px;
  font-weight:700;display:none;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 4px 18px rgba(0,0,0,0.35)}
@media (orientation:portrait){
  #touchovl{--touch-s:clamp(48px,12vmin,60px);--touch-l:clamp(58px,15vmin,72px)}
  #joy{left:clamp(calc(68px + var(--safe-left)),46%,calc(94px + var(--safe-left)));bottom:max(16px,calc(var(--safe-bottom) + 14px))}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="touchovl"></div>
<div id="toast"></div>
<!-- 构建顺序即依赖顺序; build.js 依此内联生成单文件 index.html -->
<script src="src/audio.data.js"></script>
<script src="src/data/data.js"></script>
<script src="src/core/gfx.js"></script>
<script src="src/core/engine.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/save.js"></script>
<script src="src/game/world.js"></script>
<script src="src/game/effects.js"></script>
<script src="src/game/combat.js"></script>
<script src="src/game/entities.js"></script>
<script src="src/game/render.js"></script>
<script src="src/data/assets.data.js"></script>
<script src="src/game/assetpipeline.js"></script>
<script src="src/data/ai_assets.data.js"></script>
<script src="src/game/aiart.js"></script>
<script src="src/data/v15.data.js"></script>
<script src="src/game/v15art.js"></script>
<script src="src/game/v15terrain.js"></script>
<script src="src/game/ui.js"></script>
<script src="src/game/main.js"></script>
</body>
</html>
